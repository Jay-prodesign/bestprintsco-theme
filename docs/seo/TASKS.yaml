audit_reprioritization:
  source: SEO-AUDIT.md
  existing_tasks_reprioritized: 8
  categories:
    active_commercial_blocker:
      phase: 2
      examples: [Broken product forms or variants, broken cart or accelerated checkout, serious mobile purchase failure, misleading scarcity or sales claims]
    active_technical_blocker:
      phase: 2
      examples: [Active Liquid HTML or JSON failure, broken schema, incorrect canonical or indexability, missing critical asset]
    trust_conversion_issue:
      phase: 2
      examples: [Unverified reviews or claims, unclear delivery returns or sizing, weak Add to Cart Buy Now or mobile usability]
    collection_seo_opportunity:
      phase: 3
      examples: [Homepage targeting, collection descriptions, collection metadata]
    product_seo_opportunity:
      phase: 4
      examples: [Keyword-stuffed titles, thin or repetitive descriptions, related-product relevance]
    image_seo_opportunity:
      phase: 5
      examples: [Missing image alt text after title and content approval]
    architecture_internal_link_opportunity:
      phase: 7
      examples: [Collection relationships, navigation, relevant product and collection links]
    measurement_data_requirement:
      phase: 1
      examples: [Search Console Analytics Shopify sales and funnel data, safe catalog source]
    low_impact_technical_debt:
      phase: 11
      examples: [Inactive translation parity, variable naming, preload warnings, unused assigns]
    requires_verification:
      phase: 1
      examples: [Rendered impact, app ownership, supplier evidence, false-positive parser findings]
    unused_legacy_issue:
      phase: 11
      examples: [Orphan snippets and unused sections only after active-use proof]
