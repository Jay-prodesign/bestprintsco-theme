finding_classification:
  confirmed_active_storefront_blocker:
    source_counts: {LiquidHTMLSyntaxError: 10, MissingAsset: 10, ValidSchema: 5, ValidJSON: 1, UndefinedObject: 20, UnclosedHTMLElement: 13}
    policy: Confirm active usage before fixing; prioritize runtime and release impact.
  confirmed_seo_performance_issue:
    examples: [Weak homepage H1, overlong metadata, invalid social/schema placeholders, missing image alt text, duplicate CSS, globally loaded third-party scripts]
    policy: Schedule in the appropriate technical SEO or performance phase.
  translation_localization_issue:
    source_counts: {MatchingTranslations: 142, TranslationKeyExists: 4}
    policy: Repair parity with validated copy; do not invent business claims.
  code_quality_issue:
    source_counts: {VariableName: 51, HardcodedRoutes: 11, AssetPreload: 3, DeprecatedFontsOnSettingsData: 3, UnusedAssign: 2}
    policy: Fix only with demonstrated value and regression coverage.
  unused_legacy_section_issue:
    source_counts: {OrphanedSnippet: 13}
    policy: Prove non-use across templates, settings, app embeds, and dynamic references before removal.
  app_generated_issue:
    examples: [Customizer scripts, app embeds, injected assets or markup]
    policy: Identify owner and purpose; never remove without approval and flow tests.
  requires_manual_verification:
    examples: [Active-template status, false syntax positives caused by dynamic Liquid, promotion and business claims, app ownership]
    policy: Record evidence and owner decision before implementation.
  possible_false_positive:
    examples: [Parser findings in intentionally dynamic Liquid/HTML, orphan reports for dynamically rendered snippets]
    policy: Reproduce on active rendered paths before changing code.
